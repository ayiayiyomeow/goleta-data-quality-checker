[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sft-quality-checker"
version = "0.2.0"
description = "Validate SFT JSONL/CSV datasets and export valid JSONL records"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sft-check = "sft_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
